<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Partner & Agent Offers Portal</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="/img/scene-logo.jpg" alt="Scene+" style="width:36px; height:36px; border-radius:8px; object-fit:cover;" />
        <div>
          <div class="brand-name">Offers Portal</div>
        </div>
      </div>
      <nav id="navMenu"></nav>
      <div class="sidebar-footer">
        <div class="who" id="whoName">—</div>
        <div class="who-role" id="whoRole">—</div>
        <div style="margin-top:12px;">
          <button class="btn btn-secondary btn-block" id="logoutBtn">Sign out</button>
        </div>
      </div>
    </aside>
    <main class="main" id="mainContent">
      <!-- rendered by app.js -->
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script src="/js/app.js"></script>
</body>
</html>
